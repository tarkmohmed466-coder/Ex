name: Android CI & Build

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment configuration
        run: |
          if [ ! -f .env.example ]; then
            echo "# Environment Variables" > .env.example
          fi
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Verify and install required Android SDK
        run: |
          echo "=== Verifying Android SDK Platform 36 & Build Tools ==="
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Verify Gradle Wrapper integrity
        run: |
          echo "=== Verifying Gradle Wrapper ==="
          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew executable script is missing from repository root!"
            exit 1
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: gradle/wrapper/gradle-wrapper.jar is missing or corrupted!"
            exit 1
          fi
          chmod +x gradlew
          echo "Gradle wrapper verified successfully."

      # Mandatory Deterministic CI Sequence: clean -> test -> compile -> process resources -> process manifest -> assemble -> verify

      - name: 1. Clean Workspace (clean)
        run: |
          ./gradlew clean --stacktrace

      - name: 2. Verify KSP Generation (ksp)
        run: |
          ./gradlew :app:kspDebugKotlin --stacktrace

      - name: 3. Run Unit Tests (test)
        run: |
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: 4. Compile Kotlin and Java (compile)
        run: |
          ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace

      - name: 5. Process Resources (process)
        run: |
          ./gradlew :app:processDebugResources --stacktrace

      - name: 6. Process Main Manifest (manifest)
        run: |
          ./gradlew :app:processDebugMainManifest --stacktrace

      - name: 7. Assemble Debug APK (assemble)
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: 8. Verify Artifacts (verify)
        run: |
          echo "=== Verifying Generated Debug APK ==="
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected APK artifact not found at $APK_PATH"
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "Found APK: $APK_PATH ($APK_SIZE bytes)"
          if [ "$APK_SIZE" -le 1000000 ]; then
            echo "ERROR: APK file size is suspiciously small: $APK_SIZE bytes"
            exit 1
          fi
          echo "Validating APK ZIP integrity..."
          unzip -t "$APK_PATH" > /dev/null
          echo "Checking for AndroidManifest.xml..."
          unzip -l "$APK_PATH" | grep -q "AndroidManifest.xml"
          echo "Checking for compiled dex files..."
          unzip -l "$APK_PATH" | grep -q "classes.dex"
          echo "Verification SUCCESS: $APK_PATH passed all integrity checks."

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: CI Failure Diagnostics
        if: failure()
        run: |
          echo "=== CI DIAGNOSTIC ENVIRONMENT INFORMATION ON FAILURE ==="
          echo "Java version:"
          java -version 2>&1 || true
          echo "Javac version:"
          javac -version 2>&1 || true
          echo "Gradle version:"
          ./gradlew --version || true
          echo "Disk space:"
          df -h || true
          echo "Memory status:"
          free -m || true
          echo "Environment variables:"
          printenv | grep -E 'ANDROID|JAVA|GRADLE|RUNNER' || true

