name: Android CI & Build

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment configuration
        run: |
          if [ ! -f .env.example ]; then
            echo "# Environment Variables" > .env.example
          fi
          if [ ! -f .env ]; then
            touch .env
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Grant execute permissions for gradlew (if present)
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      # Mandatory CI Sequence: clean -> test -> compile -> process -> assemble -> verify

      - name: 1. Clean Workspace (clean)
        run: |
          if [ -f gradlew ]; then
            ./gradlew clean --stacktrace
          else
            gradle clean --stacktrace
          fi

      - name: 2. Run Unit Tests (test)
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:testDebugUnitTest --stacktrace
          else
            gradle :app:testDebugUnitTest --stacktrace
          fi

      - name: 3. Compile Sources (compile)
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace
          else
            gradle :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace
          fi

      - name: 4. Process Resources (process)
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:processDebugResources --stacktrace
          else
            gradle :app:processDebugResources --stacktrace
          fi

      - name: 5. Assemble Debug APK (assemble)
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: 6. Verify Artifacts (verify)
        run: |
          echo "=== Verifying Generated Debug APK ==="
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected APK artifact not found at $APK_PATH"
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "Found APK: $APK_PATH ($APK_SIZE bytes)"
          if [ "$APK_SIZE" -le 1000000 ]; then
            echo "ERROR: APK file size is suspiciously small: $APK_SIZE bytes"
            exit 1
          fi
          echo "Verification SUCCESS: $APK_PATH passed all integrity checks."

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
